repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift format
        entry: swift format --in-place
        language: system
        types: [swift]
      - id: swift-format-lint
        name: swift format lint
        entry: swift format lint --strict
        language: system
        types: [swift]
      - id: swift-test
        name: swift test
        entry: ./scripts/test.sh
        language: system
        pass_filenames: false
