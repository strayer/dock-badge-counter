name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update formula
        run: |
          # Get the tag name (remove 'v' prefix if present)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG_NAME#v}"
          
          # Download the release tarball (fail loudly on 404 etc.) and verify it is what the
          # formula expects before hashing it.
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG_NAME}.tar.gz"
          curl --fail --silent --location --output release.tar.gz "$TARBALL_URL"
          SHA256=$(shasum -a 256 release.tar.gz | cut -d' ' -f1)

          tar -xzf release.tar.gz
          SRC_DIR=$(tar -tzf release.tar.gz | head -1 | cut -d/ -f1)
          test -f "$SRC_DIR/examples/config.toml" || { echo "examples/config.toml missing from tarball"; exit 1; }
          if ! grep -q "let version = \"$VERSION\"" "$SRC_DIR/Sources/Commands/DockBadgeCounter.swift"; then
            echo "Sources/Commands/DockBadgeCounter.swift does not declare version $VERSION"; exit 1
          fi
          rm -rf release.tar.gz "$SRC_DIR"
          
          echo "Updating formula for version: $VERSION"
          echo "Tarball URL: $TARBALL_URL"
          echo "Calculated SHA256: $SHA256"
          
          # Update the formula file
          # Replace both the URL and SHA256 using more robust patterns
          sed -i "s|url \".*\"|url \"$TARBALL_URL\"|" Formula/dock-badge-counter.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" Formula/dock-badge-counter.rb
          
          # Verify the changes
          echo "Updated formula contents:"
          cat Formula/dock-badge-counter.rb

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Formula/dock-badge-counter.rb
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "Update formula for ${{ github.event.inputs.tag_name }}"
          else
            git commit -m "Update formula for ${{ github.event.release.tag_name }}"
          fi
          git push